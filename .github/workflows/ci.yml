name: CI

# Validates every push and PR (incl. Dependabot bump PRs) with the same gates we run locally:
# ruff lint + format, mypy, pytest. Tests use in-memory SQLite, so no Postgres service is needed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          # Matches [tool.mypy] python_version; numpy's stubs need >= 3.12 to parse.
          python-version: "3.12"
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q
