name: CI

# Validates every push and PR (incl. Dependabot bump PRs) with the same gates we run locally:
# ruff lint + format, mypy, pytest. Tests use in-memory SQLite, so no Postgres service is needed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Cache the uv download + resolver cache, keyed on the committed lockfile.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment (locked, dev group + optional extras)
        # --frozen fails the build if uv.lock is out of date with pyproject.toml, so the
        # committed lockfile is authoritative. Optional extras matter: their tests
        # importorskip optional dependencies, so without the extras CI can silently skip them.
        # The dev group installs by default.
        # Python comes from .python-version (3.12); numpy's stubs need >= 3.12 to parse.
        run: uv sync --frozen --extra ml --extra tracking --extra archive --extra research --extra sentiment --extra dashboard

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest (with coverage floor — fail_under lives in pyproject.toml)
        run: uv run pytest -q --cov=ibkr_trader
