name: CI

# Validates every push and PR (incl. Dependabot bump PRs) with the same gates we run locally:
# ruff lint + format, mypy, pytest. Tests use in-memory SQLite, so no Postgres service is needed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Matches [tool.mypy] python_version; numpy's stubs need >= 3.12 to parse.
          python-version: "3.12"
          cache: pip

      - name: Install (editable + dev, ml and archive extras)
        # [ml] and [archive] matter: their tests importorskip the extras, so without them they
        # silently skip and CI green stops meaning "the ML and archive paths work".
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,ml,archive]

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest (with coverage floor — fail_under lives in pyproject.toml)
        run: pytest -q --cov=ibkr_trader
