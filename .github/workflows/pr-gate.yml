name: PR Gate

# Both halves of the gate, in two independent jobs.
#
# They used to be two *workflows* — this one, and a `CI` workflow carrying ruff, mypy
# and pytest. The separation was for a good reason and it survives here: `devkit` needs
# no dependency install (the vendored hook scripts are stdlib-only by contract), so it
# runs on a bare Python and stays green even when the environment is broken, which is
# exactly when you still want to see harness drift. Jobs are separate runners, so
# nothing about that changes by living in one file.
#
# What did change is that the split was no longer only cosmetic. The vendored
# `dependabot-automerge.yml` merges a bot PR when the workflow titled **`PR Gate`**
# succeeds, and it is titled that in every project because the file is byte-identical
# everywhere. With the real checks in a workflow called `CI`, this gate could pass on a
# PR whose lint and tests had failed, and the bump would merge on the strength of a
# drift check.
on:
  push:
    branches: [main]
  pull_request:
  # Re-runnable by hand, and by the fix pass: an auto-merge pushes with `GITHUB_TOKEN`,
  # which raises no `push` event, so main's new tip is gated only by a dispatched run.
  # Without this trigger that dispatch is refused with HTTP 422 and main stays unread.
  workflow_dispatch:

# Read-only, declared at the top level so it applies to every job rather than being
# inherited from the repository default — which is settable per repo and per org, so a
# workflow that says nothing does not actually know what it has. The sibling checkout
# authenticates with DATA_LAKE_DEPLOY_KEY, not this token, so nothing here needs write.
permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devkit:
    name: Vendored devkit harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The vendored suite. It is NOT reachable from `uv run pytest`: pyproject's
      # testpaths is ["tests"], so these would never run there — including
      # test_repo_contract.py, whose whole job is to catch a Stop hook that dispatches
      # to a script this repo does not have.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      # The JUnit report is this job's failure artifact: without it a red vendored suite
      # uploads nothing, and the fix pass's session has to dig the ids out of the run log.
      - name: Vendored hook tests
        run: python -m pytest scripts/hooks/tests/ -q --tb=short --junit-xml=logs/junit-hooks.xml

      - name: Upload vendored test artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vendored-test-failures
          path: logs/junit-hooks.xml

      # Cross-repo drift: the vendored files must match the devkit revision this repo
      # is stamped at. Pinned to a tag, never @main — one bad upstream commit must not
      # redden this repo. `sync-devkit.py --pull` bumps this `ref:`, the `rev:` in
      # .pre-commit-config.yaml, and DEVKIT_VERSION together; all three name the same
      # upstream revision and a mismatch means the two gates compare different trees.
      - name: Check out devkit
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/devkit
          ref: v0.11.45
          path: .devkit-src

      - name: Vendored devkit harness in sync
        env:
          DEVKIT_DIR: ${{ github.workspace }}/.devkit-src
        run: python scripts/sync-devkit.py --check

  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ibkr_trader
    steps:
      # Keep both private repositories side by side so the editable ../data-lake source in
      # pyproject.toml resolves exactly as it does in the documented local checkout.
      - name: Checkout ibkr_trader
        uses: actions/checkout@v7
        with:
          path: ibkr_trader

      # Pinned to the data-lake commit uv.lock was resolved against, never its default
      # branch. The lock records data-lake's own metadata -- its dev group included -- so
      # every pyproject edit there (a devkit floor, a Dependabot ruff bump) left this gate
      # red on main with no push here; it took three relocks in two days. Bumping data-lake
      # is one commit: move this ref, run `uv lock`, commit both. The nightly still runs
      # against data-lake's default branch, and is where that drift is meant to surface.
      # tests/test_ci_data_lake_pin.py holds this ref to a full commit SHA.
      - name: Checkout data-lake
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/data-lake
          ref: c14c6bef2a83741492107e8b2df157aebea95f34
          ssh-key: ${{ secrets.DATA_LAKE_DEPLOY_KEY }}
          path: data-lake

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: ibkr_trader
          # Cache the uv download + resolver cache, keyed on the committed lockfile.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment (locked, dev group + optional extras)
        # --locked fails this step if uv.lock no longer resolves against pyproject.toml and
        # the ../data-lake checkout above. --frozen never checked: when data-lake raised its
        # pandas floor past what alphalens allows, the first `uv run` relocked and the gate
        # reported "Ruff lint" red. Optional extras matter: their tests importorskip
        # optional dependencies, so without the extras CI can silently skip them.
        # The dev group installs by default.
        # Python comes from .python-version (3.12); numpy's stubs need >= 3.12 to parse.
        run: uv sync --locked --extra ml --extra tracking --extra archive --extra research --extra sentiment --extra report

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest (with coverage floor — fail_under lives in pyproject.toml)
        run: uv run pytest -q --cov=ibkr_trader
