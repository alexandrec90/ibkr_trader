# Dependabot keeps dependencies current and surfaces security advisories via PRs.
# Scope: Python libraries (pyproject.toml) + any GitHub Actions we add later.
#
# NOTE: our pyproject pins are floors (`>=`), and there is no lockfile, so version-update PRs
# raise the *minimum* bound rather than pinning an exact upgrade. The real safety net is CI:
# once a ruff/mypy/pytest workflow exists (TODO §5), these PRs get validated automatically —
# that is what would have caught the numpy-vs-mypy version skew. Enable security alerts in the
# repo settings (Security → Code security) so advisories open PRs even between scheduled runs.
version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # Batch non-breaking bumps into one PR each to cut review noise; majors stay individual.
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by workflows (no-op until a workflow lands under .github/workflows/).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
