# Dependabot keeps dependencies current and surfaces security advisories via PRs.
# Scope: Python libraries (pyproject.toml) + any GitHub Actions we add later.
#
# NOTE: our pyproject pins are floors (`>=`) and uv.lock records what is tested. A floor says
# what the code needs, so the Python entry uses `increase-if-necessary`: a bump the floor
# already allows leaves pyproject alone. PR Gate validates every update PR, and its
# `uv sync --locked` fails one whose lock no longer resolves. Enable security alerts in the
# repo settings (Security → Code security) so advisories open PRs even between scheduled runs.
version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "python"
    # Without this the PRs land in no tab on github.com/pulls and are found only by
    # opening this repo. It is per-entry, not global.
    assignees:
      - "alexandrec90"
    # Batch non-breaking bumps into one PR each to cut review noise; majors stay individual.
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by workflows (no-op until a workflow lands under .github/workflows/).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "alexandrec90"
