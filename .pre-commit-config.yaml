fail_fast: true

# Deliberately minimal — nothing here may be slow. The real gates (ruff, mypy,
# pytest) are CI-owned in .github/workflows/ci.yml and available locally as
# `python scripts/lint-all.py` / `python scripts/run-tests.py`. A commit hook that
# runs the suite gets bypassed, and a bypassed gate is worse than no gate.
#
# There is nothing to install. The owner's machine sets a global `core.hooksPath`
# (~/.devkit/git-hooks, from devkit's install-git-policy.py), and that dispatcher runs
# the pre-commit framework itself whenever a repo has this file — `pre-commit install`
# would write into .git/hooks, which core.hooksPath bypasses entirely.
#
# What it needs instead is for pre-commit to be *importable*: the dispatcher looks for
# .venv/Scripts/pre-commit.exe (then PATH, then the module) and prints "project has
# .pre-commit-config.yaml but pre-commit is not installed" if it finds none. That is
# why pre-commit is in the dev group — `uv sync` is the whole setup step.
repos:
  # --- devkit's published hooks ------------------------------------------------
  # Cheap by design (a TOML parse, an import scan, a byte-compare), so these honour
  # the "nothing slow" rule above despite not being local.
  #
  # `devkit-drift` is the one that earns its place. `sync-devkit.py --check` resolves
  # its source from $DEVKIT_DIR and exits 0 doing NOTHING when that is unset —
  # indistinguishable from success in a log. Through pre-commit there is nothing to
  # configure: pre-commit has already cloned devkit at the rev below, so the version
  # compared against is written down here. Keep the PR gate's `--check` step too —
  # they fail differently, and the CI one is what survives a bypassed local hook.
  #
  # Keep `rev` in step with .github/workflows/pr-gate.yml's `ref:` and the
  # DEVKIT_VERSION stamp: all three name the upstream revision this repo is vendored
  # from, and a mismatch means the commit-time gate and the CI gate check against
  # different trees. `sync-devkit.py --pull` moves all three together.
  - repo: https://github.com/alexandrec90/devkit
    rev: v0.9.1 # a tag, never a branch — one bad upstream commit must not redden this repo
    hooks:
      # Fails on a .devkit.toml the harness would otherwise ignore: unparseable TOML
      # (the loader falls back to neutral defaults rather than erroring), a path
      # prefix missing its trailing slash, a directory that does not exist here, or a
      # [db]/[frontend] block switched on and left half-filled.
      - id: devkit-manifest
      # The vendored hook scripts run *before* the virtualenv exists, so a
      # third-party import there fails at hook time rather than at test time — which
      # no test suite can catch, because the suite runs inside that virtualenv.
      - id: devkit-hooks-stdlib-only
      # Byte-compares every file in sync-devkit.py's MANIFEST against the pinned rev.
      - id: devkit-drift
