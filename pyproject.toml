[project]
name = "ibkr-trader"
version = "0.1.0"
description = "Cloud-hosted service for programmatic trading via Interactive Brokers: news/social/market data ingestion, prediction, backtesting, paper trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Shared ingestion + archive layer (docs/plans/active/data-lake.md, Phase 2). Brings the
    # provider clients with it — httpx/praw/pytrends/yfinance are its dependencies now, not ours.
    "data-lake",
    "ib_async>=1.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "APScheduler>=3.10",
    "typer>=0.12",
    "tenacity>=8.2",
    "vaderSentiment>=3.3",
    "pandera>=0.32.1",
]

[project.optional-dependencies]
# ML training extra (ML-03): the core package must import without it — training modules
# guard these imports and tests importorskip them.
ml = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "optuna>=3.6",
]
# Optional local experiment browser. Training artifacts and metadata.json remain authoritative.
tracking = [
    "mlflow>=3.1",
]
# Cold-data archive extra (docs/operations/remote-archive.md). The archive code lives in the
# data-lake package now, so this just forwards to its extra (pyarrow + boto3).
archive = [
    "data-lake[archive]",
]
# Read-only research lens over archived Parquet (duckdb, via the package) plus this repo's own
# research tooling. Imports are guarded like [ml]/[archive].
research = [
    "data-lake[research]",
    "alphalens-reloaded>=0.4.6",
    "polars>=1.0",
]
# Finance-tuned headline sentiment. Runtime loading is local-cache-only; downloading the
# model is an explicit CLI operation.
sentiment = [
    "transformers>=4.40",
    "torch>=2.2",
]
# Static HTML results report (`ibkr-trader report`). Same guarded-import pattern as [ml]:
# dashboard/data.py stays importable without this; only dashboard/report.py needs plotly.
report = [
    "plotly>=5.22",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
# Sibling checkout, editable so package edits land here without a reinstall. It is a private
# repo, so a path keeps `uv sync` working offline and without credentials; the Docker `app`
# image gets it by building from the parent directory (see docker-compose.yml).
data-lake = { path = "../data-lake", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Dev tooling is a PEP 735 dependency group (not an extra): `uv sync` installs it by default,
# and it never leaks into the published package metadata.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ibkr-trader = "ibkr_trader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_trader"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness and security only. `.claude/rules/engineering.md` is the policy: lint
# catches the problems a reviewer reads past, and "anything a formatter can decide" is
# off.
#
# Dropped families -- none of them can report a defect. Each enforces a preferred
# spelling of code that already behaves identically:
#
#   I    import ordering            UP   preferred modern syntax
#   SIM  readability rewrites       N    naming conventions
#   T20  stray print() calls
#
# They were also nearly free to violate already: `ruff check --fix` rewrites all of
# them silently in the lint-fix PostToolUse hook, in pre-commit, and in lint-all.py.
# What enforcing them bought was churn in every diff, not a bug caught.
select = ["E", "F", "B"]

# `E` is a *family prefix* carrying 19 rules, and only some are about correctness.
# That is exactly how E501 (line-too-long) came to be enforced: nobody selected it,
# they selected `"E"`, and it rode in with the family -- then got suppressed one
# directory at a time for years rather than questioned. Listed here are its cosmetic
# members: line length, statement layout, semicolons, ambiguous single-char names.
#
# E501 is also the one that actually blocked a commit, because it is the one with **no
# autofix** -- it fires precisely where the formatter cannot split a line (long string
# literals, URLs), so there was never an action to take.
#
# `line-length` above is untouched and still drives `ruff format`: code is still
# wrapped, silently, on every edit.
#
# Still on: E402, E711/E712/E713/E714 (comparison bugs), E721, E722 (bare except),
# E902, E999. Those catch real defects.
ignore = ["E101", "E401", "E501", "E701", "E702", "E703", "E731", "E741", "E742", "E743"]

[tool.ruff.lint.per-file-ignores]
# B008: typer's declarative style requires typer.Option(...) in argument defaults
"src/ibkr_trader/cli.py" = ["B008"]

[tool.mypy]
# Analysis target must be >= the highest stub floor of our installed deps: numpy 2.5's bundled
# stubs use 3.12+ syntax, so a 3.11 target makes mypy choke parsing them before it reaches our
# code. 3.12 is a safe floor (the venv runs 3.14) while `requires-python = ">=3.11"` still holds.
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is enforced in CI via `pytest --cov=ibkr_trader` (plain `pytest` stays fast locally).
# The floor is a ratchet: raise it as coverage grows, never lower it to make a change pass.
#
# Lowered 90.8 -> 90.1 on 2026-07-30, the one legitimate reason to move a ratchet down: the
# denominator changed. Phase 2 moved ingestion/ and archive/ (and their tests) into the
# data-lake package, and that code was slightly better covered than what remains here, so the
# same tests over a smaller repo measure 90.15%. No code lost coverage in the move — total
# coverage across the two repos went up, since the package sits at 92% behind its own floor.
# Measure with all extras installed (`uv sync --extra ml --extra archive --extra research
# --extra report`); without [ml] the training modules silently drop ~10pp.
[tool.coverage.report]
fail_under = 90.1
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
