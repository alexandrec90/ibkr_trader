[project]
name = "ibkr-trader"
version = "0.1.0"
description = "Cloud-hosted service for programmatic trading via Interactive Brokers: news/social/market data ingestion, prediction, backtesting, paper trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=1.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "praw>=7.7",
    "pytrends>=4.9",
    "APScheduler>=3.10",
    "typer>=0.12",
    "tenacity>=8.2",
    "yfinance>=0.2.50",
    "vaderSentiment>=3.3",
    "pandera>=0.32.1",
]

[project.optional-dependencies]
# ML training extra (ML-03): the core package must import without it — training modules
# guard these imports and tests importorskip them.
ml = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "optuna>=3.6",
]
# Optional local experiment browser. Training artifacts and metadata.json remain authoritative.
tracking = [
    "mlflow>=3.1",
]
# Cold-data archive extra (docs/remote-archive.md): same guarded-import pattern as [ml].
archive = [
    "pyarrow>=17",
    "boto3>=1.34",
]
# Read-only research lens over archived Parquet. Imports are guarded like [ml]/[archive].
research = [
    "alphalens-reloaded>=0.4.6",
    "duckdb>=1.0",
    "polars>=1.0",
]
# Finance-tuned headline sentiment. Runtime loading is local-cache-only; downloading the
# model is an explicit CLI operation.
sentiment = [
    "transformers>=4.40",
    "torch>=2.2",
]
# Static HTML results report (`ibkr-trader report`). Same guarded-import pattern as [ml]:
# dashboard/data.py stays importable without this; only dashboard/report.py needs plotly.
report = [
    "plotly>=5.22",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Dev tooling is a PEP 735 dependency group (not an extra): `uv sync` installs it by default,
# and it never leaks into the published package metadata.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ibkr-trader = "ibkr_trader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_trader"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: typer's declarative style requires typer.Option(...) in argument defaults
"src/ibkr_trader/cli.py" = ["B008"]

[tool.mypy]
# Analysis target must be >= the highest stub floor of our installed deps: numpy 2.5's bundled
# stubs use 3.12+ syntax, so a 3.11 target makes mypy choke parsing them before it reaches our
# code. 3.12 is a safe floor (the venv runs 3.14) while `requires-python = ">=3.11"` still holds.
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is enforced in CI via `pytest --cov=ibkr_trader` (plain `pytest` stays fast locally).
# The floor is a ratchet: raise it as coverage grows, never lower it to make a change pass.
[tool.coverage.report]
fail_under = 90.8
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
