[project]
name = "ibkr-trader"
version = "0.1.0"
description = "Cloud-hosted service for programmatic trading via Interactive Brokers: news/social/market data ingestion, prediction, backtesting, paper trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=1.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "praw>=7.7",
    "pytrends>=4.9",
    "APScheduler>=3.10",
    "typer>=0.12",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ibkr-trader = "ibkr_trader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_trader"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: typer's declarative style requires typer.Option(...) in argument defaults
"src/ibkr_trader/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
