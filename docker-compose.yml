# Local dev + single-VM cloud deployment.
# Usual dev loop: `docker compose up -d db` and run the app natively.
#
# The explicit project name below pins the Compose project regardless of the checkout
# directory. Without it, running `docker compose up` from a git worktree (directory name
# `ibkr_trader-a` etc.) would derive a different project name and silently create a second
# Postgres container + pgdata volume and collide on host port 5433. With it, every worktree
# resolves to the same shared infra containers. See docs/operations/parallel-worktrees.md.
# The paper ib-gateway service needs TWS_USERID_PAPER/TWS_PASSWORD_PAPER in .env and a human to
# approve 2FA periodically.

name: ibkr_trader

services:
  db:
    # TimescaleDB is Postgres 16 plus the timescaledb extension (price_bars is a compressed
    # hypertable — see migrations/…_timescaledb_price_bars_hypertable.py and
    # docs/operations/remote-archive.md). The image is a drop-in Postgres: without CREATE EXTENSION it
    # behaves exactly like postgres:16, and the schema migration only converts price_bars when
    # the extension is present, so tests/CI on plain Postgres or SQLite are unaffected.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    # The image runs timescaledb-tune at initdb, which sizes shared_buffers to 25% of the
    # memory Docker shows it -- ~1 GB inside a 4 GB WSL VM on a 16 GB box, for a ~1.2 GB
    # database, and the whole buffer pool stays resident. `-c` overrides the tuned
    # postgresql.conf in the existing volume too. A bigger host raises them through .env.
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-256MB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-128MB}
    # Capped like `app` below, for the same shared VM: 657 MiB resident minutes after a VM
    # boot on 2026-10-09, uncapped. 768m is shared_buffers plus room for the backends, which
    # only holds while idle ones disconnect (`IDLE_SESSION_TIMEOUT_MS` in db/session.py).
    mem_limit: ${DB_MEM_LIMIT:-768m}
    memswap_limit: ${DB_MEM_LIMIT:-768m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: ${POSTGRES_DB:-ibkr_trader}
    ports:
      # Host 5433 because a local PostgreSQL already occupies 5432 on the dev machine.
      # That is slot 1 in devkit's ports.toml, which is the machine-wide registry of
      # which checkout owns which host port; the default here must keep matching it.
      # Kept as a variable rather than a literal so the port can move without editing
      # this file — note that unlike carameli, worktrees here deliberately SHARE one
      # db container (see the `name:` pin above and docs/operations/parallel-worktrees.md), so
      # this is not a per-worktree offset.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-ibkr_trader}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ib-gateway:
    # Docs: https://github.com/gnzsnz/ib-gateway-docker
    # Verify env var names against the image README before first run.
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    profiles: ["ibkr"] # opt-in: `docker compose --profile ibkr up -d`
    # Left stopped while nothing trades (GATEWAY_WATCH_ENABLED defaults to false): it holds
    # ~300 MB of the shared VM. Starting it again means turning the watch back on in .env.
    # Capped anyway (294 MiB observed), so starting it again cannot bring the VM wedge back.
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    memswap_limit: ${GATEWAY_MEM_LIMIT:-512m}
    environment:
      # Empty credentials just make the gateway container fail its login loop;
      # In single-session paper mode the image expects the generic names, so map the
      # explicitly paper-scoped credentials from .env at the Compose boundary.
      TWS_USERID: ${TWS_USERID_PAPER:-}
      TWS_PASSWORD: ${TWS_PASSWORD_PAPER:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-yes}
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: America/Montreal
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # NEVER expose these beyond localhost / the compose network.
      - "127.0.0.1:4003:4003" # live API (socat forward)
      - "127.0.0.1:4004:4004" # paper API (socat forward)
      - "127.0.0.1:5900:5900" # VNC (debugging the gateway UI)

  app:
    # Context is the PARENT directory, not this one: `data-lake` is a sibling checkout and a
    # path dependency, and Docker cannot COPY from outside the build context. That is the whole
    # reason for the `..` here — a plain `build: .` fails to install the package.
    build:
      context: ..
      dockerfile: ibkr_trader/Dockerfile
    restart: unless-stopped
    # The scheduler service: `docker compose --profile app up -d --build app` runs
    # `ibkr-trader serve` (ingestion polls, Finnhub history backfill, sentiment scoring, raw
    # pruning). Rebuild the image (--build) after code changes or they won't reach this
    # container. Opt-in so the usual dev loop (db only + native app) stays unchanged.
    profiles: ["app"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader}@db:5432/${POSTGRES_DB:-ibkr_trader}
      IBKR_HOST: ib-gateway
      IBKR_PORT: "4004"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Universe/keyword files stay host-editable (not baked into the image): edit + restart
      # the container, no rebuild needed. The image itself only carries code.
      - ./tickers.txt:/app/tickers.txt:ro
      - ./trends-keywords.txt:/app/trends-keywords.txt:ro
      - ./news-keywords.txt:/app/news-keywords.txt:ro
      # The scheduler's health artifact, which `ibkr-trader health` reads. A named volume, not
      # a path inside the container: `up --build` RECREATES the container, so an artifact
      # living in the image's filesystem is destroyed on every deploy and every job reads back
      # as "never-run" for a full cadence afterwards. Named (not bind-mounted) so the
      # directory keeps the image's appuser ownership — see the chown in the Dockerfile.
      - applogs:/app/logs
    command: ["ibkr-trader", "serve"]
    # Every service on the machine shares one 4 GB WSL VM (with 2 GB swap), and `serve` had
    # no cap: 2026-10-09 it held 2.4 GB resident ten minutes after a restart, ran the VM out
    # of memory and swap, and the frozen VM took Docker's engine and every other project's
    # containers with it, several times that day. Capped, an overrun is killed inside its own
    # cgroup and `restart: unless-stopped` brings it back. The swap limit equal to the memory
    # one keeps it from thrashing the VM's swap instead. A bigger host raises it through .env.
    # 1536m, not 2g: app + db (768m) + the other projects' 512m caps must leave ~0.75 GB of
    # the 4 GB for dockerd and the kernel. The startup jobs are staggered (scheduler.py,
    # STARTUP_STAGGER_SECONDS) so the post-boot burst, which peaked at 1.65 GiB, fits under it.
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    memswap_limit: ${APP_MEM_LIMIT:-1536m}

volumes:
  pgdata:
  applogs:
