# Per-project config for the vendored devkit hook scripts (scripts/hooks/*.py), read
# by scripts/hooks/harness_config.py. Schema + neutral defaults: that module's
# dataclasses. Upstream source of truth for the scripts themselves:
# https://github.com/alexandrec90/devkit
#
# This file is the per-project seam and is deliberately NOT in sync-devkit.py's
# MANIFEST — editing it here is correct and is never reported as drift.
#
# Only the tables `harness_config.from_dict` consumes are legal here ([project],
# [paths], [db], [frontend], [python], [bash]). The loader never inspects what it
# did not consume, so an unknown table reads as "unset" and silently disables the
# tier it was meant to configure; the pre-commit `devkit-manifest` hook and
# scripts/hooks/tests/test_repo_contract.py are what make that visible.

[project]
# Prefix for the harness control env vars stop.py reads:
#   IBKR_TRADER_SKIP_STOP_VERIFY, IBKR_TRADER_STOP_TESTS_AUTOSTART
env_prefix = "IBKR_TRADER"

[paths]
app = "src/ibkr_trader/"
tests = "tests/"
# Flat suite — no tests/unit split, so an app-code change runs everything under
# tests/. `stop.py` uses this as the target when application code changes.
unit_tests = "tests"

[db]
# OFF on purpose, and this is the important line in the file.
#
# The DB tier exists to run host pytest against a live Postgres over its published
# compose port. This project's entire suite runs on in-memory SQLite and needs no
# container at all (.claude/rules/testing.md: "Never start Docker to run tests"), and
# CLAUDE.md is explicit that containers stay stopped on this memory-constrained
# laptop unless a command actually needs one. Enabling the tier would have the Stop
# hook start Postgres after edits that do not need it.
#
# The db container IS needed for alembic and for real-dataset ingest/backtest runs —
# neither of which is something a Stop hook should trigger.
enabled = false

[frontend]
# No frontend tier: this is a CLI + scheduler service.
enabled = false
